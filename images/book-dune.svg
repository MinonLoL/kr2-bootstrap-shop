<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bgDune" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="duneSand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" rx="12" fill="url(#bgDune)"/>
  <rect x="15" y="15" width="270" height="390" rx="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Twin Moons of Arrakis -->
  <circle cx="110" cy="125" r="30" fill="#fef3c7" opacity="0.9"/>
  <circle cx="165" cy="110" r="16" fill="#fde68a" opacity="0.75"/>
  
  <!-- Desert Dunes -->
  <path d="M 15 260 Q 90 200 180 250 Q 240 220 285 270 L 285 405 L 15 405 Z" fill="url(#duneSand)"/>
  <path d="M 15 285 Q 120 230 200 290 Q 250 270 285 300 L 285 405 L 15 405 Z" fill="#b45309"/>
  <path d="M 15 320 Q 90 270 170 320 Q 230 290 285 330 L 285 405 L 15 405 Z" fill="#78350f"/>
  
  <!-- Typography -->
  <text x="150" y="60" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fde68a" text-anchor="middle" letter-spacing="3">ФРЭНК ГЕРБЕРТ</text>
  <line x1="80" y1="72" x2="220" y2="72" stroke="#f59e0b" stroke-width="1"/>
  
  <text x="150" y="345" font-family="'Trebuchet MS', sans-serif" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8">ДЮНА</text>
  <text x="150" y="380" font-family="sans-serif" font-size="11" fill="#fde68a" text-anchor="middle" letter-spacing="1">НАУЧНАЯ ФАНТАСТИКА • КУЛЬТОВЫЙ ЦИКЛ</text>
</svg>

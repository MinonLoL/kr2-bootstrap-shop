  <line x1="12" y1="22" x2="20" y2="22" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="12" y1="26" x2="18" y2="26" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  
  <line x1="28" y1="18" x2="36" y2="18" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="28" y1="22" x2="36" y2="22" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="28" y1="26" x2="34" y2="26" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Star of Quality above -->
  <path d="M 24 4 L 25.5 8 L 29.5 8.5 L 26.5 11.2 L 27.5 15 L 24 13 L 20.5 15 L 21.5 11.2 L 18.5 8.5 L 22.5 8 Z" fill="#fbbf24" stroke="#d97706" stroke-width="0.8"/>

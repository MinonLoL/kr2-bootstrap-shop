<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bgPrince" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" rx="12" fill="url(#bgPrince)"/>
  <rect x="15" y="15" width="270" height="390" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- Asteroid B-612 with Rose under Glass Dome and stars -->
  <!-- Tiny Asteroid -->
  <circle cx="150" cy="245" r="75" fill="#334155"/>
  <!-- Asteroid craters -->
  <circle cx="130" cy="230" r="10" fill="#1e293b"/>
  <circle cx="170" cy="250" r="14" fill="#1e293b"/>
  <circle cx="145" cy="275" r="8" fill="#1e293b"/>

  <!-- Little Prince silhouette on asteroid -->
  <circle cx="125" cy="145" r="8" fill="#fde047"/> <!-- hair/head -->
  <rect x="122" y="153" width="6" height="18" fill="#22c55e"/> <!-- green suit -->
  <!-- Yellow Scarf blowing in the cosmic wind -->
  <path d="M 128 155 Q 150 145 165 152 Q 155 160 128 158 Z" fill="#eab308"/>

  <!-- The Rose in Glass Dome -->
  <path d="M 160 170 C 160 150 180 150 180 170 Z" fill="#e0f2fe" opacity="0.6"/>
  <circle cx="170" cy="165" r="5" fill="#ef4444"/> <!-- Rose -->
  <line x1="170" y1="170" x2="170" y2="174" stroke="#15803d" stroke-width="2"/>
  <rect x="157" y="174" width="26" height="3" fill="#94a3b8"/> <!-- stand -->

  <!-- Stars -->
  <polygon points="60,60 62,65 67,65 63,68 65,73 60,70 55,73 57,68 53,65 58,65" fill="#fde047"/>
  <polygon points="230,80 232,84 236,84 233,87 234,91 230,89 226,91 227,87 224,84 228,84" fill="#fde047"/>
  <polygon points="80,180 81,183 84,183 82,185 83,188 80,186 77,188 78,185 76,183 79,183" fill="#fde047"/>

  <!-- Typography -->
  <text x="150" y="60" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#7dd3fc" text-anchor="middle" letter-spacing="2">АНТУАН ДЕ СЕНТ-ЭКЗЮПЕРИ</text>
  <line x1="60" y1="72" x2="240" y2="72" stroke="#38bdf8" stroke-width="1"/>
  
  <text x="150" y="340" font-family="'Times New Roman', serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">МАЛЕНЬКИЙ</text>
  <text x="150" y="368" font-family="'Times New Roman', serif" font-size="26" font-weight="bold" fill="#fde047" text-anchor="middle">ПРИНЦ</text>
  <text x="150" y="394" font-family="sans-serif" font-size="11" fill="#bae6fd" text-anchor="middle">ФИЛОСОФСКАЯ СКАЗКА • ПРИТЧА</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffecb3" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Book Icon -->
  <g transform="translate(10, 12)">
    <path d="M 5 10 Q 25 2 45 10 L 45 48 Q 25 40 5 48 Z" fill="url(#goldGrad)" />
    <path d="M 45 10 Q 65 2 85 10 L 85 48 Q 65 40 45 48 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 45 10 L 45 48" stroke="#5d4037" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 12 18 Q 25 12 38 18" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.7"/>
    <path d="M 12 25 Q 25 19 38 25" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.7"/>
    <path d="M 12 32 Q 25 26 38 32" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.7"/>
    <path d="M 52 18 Q 65 12 78 18" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.7"/>
    <path d="M 52 25 Q 65 19 78 25" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.7"/>
    <path d="M 52 32 Q 65 26 78 32" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.7"/>
    <!-- Star on top -->
    <polygon points="45,0 47,6 53,6 48,10 50,16 45,12 40,16 42,10 37,6 43,6" fill="#ffd54f"/>
  </g>
  <!-- Typography -->
  <text x="105" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="1">GOLDA<tspan fill="url(#goldGrad)">BOOK</tspan></text>
  <text x="106" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" fill="#cbd5e1" letter-spacing="2">КНИЖНЫЙ КЛУБ И СООБЩЕСТВО</text>
</svg>

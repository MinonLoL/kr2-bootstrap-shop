<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bgSol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="yellowButter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" rx="12" fill="url(#bgSol)"/>
  <rect x="15" y="15" width="270" height="390" rx="8" fill="none" stroke="#34d399" stroke-width="2"/>

  <!-- Yellow Butterflies of Macondo (Mauricio Babilonia's yellow butterflies) -->
  <g transform="translate(150, 190)">
    <!-- Main Butterfly -->
    <ellipse cx="-15" cy="-12" rx="18" ry="12" fill="url(#yellowButter)" transform="rotate(-25 -15 -12)"/>
    <ellipse cx="15" cy="-12" rx="18" ry="12" fill="url(#yellowButter)" transform="rotate(25 15 -12)"/>
    <ellipse cx="-10" cy="8" rx="12" ry="9" fill="#ca8a04" transform="rotate(-15 -10 8)"/>
    <ellipse cx="10" cy="8" rx="12" ry="9" fill="#ca8a04" transform="rotate(15 10 8)"/>
    <ellipse cx="0" cy="0" rx="3" ry="16" fill="#1c1917"/>
    
    <!-- Mini Butterflies fluttering -->
    <g transform="translate(-60, -50) scale(0.5)">
      <ellipse cx="-15" cy="-10" rx="16" ry="10" fill="#fef08a"/>
      <ellipse cx="15" cy="-10" rx="16" ry="10" fill="#fef08a"/>
    </g>
    <g transform="translate(65, -40) scale(0.4) rotate(20)">
      <ellipse cx="-15" cy="-10" rx="16" ry="10" fill="#fef08a"/>
      <ellipse cx="15" cy="-10" rx="16" ry="10" fill="#fef08a"/>
    </g>
    <g transform="translate(45, 45) scale(0.45) rotate(-30)">
      <ellipse cx="-15" cy="-10" rx="16" ry="10" fill="#fef08a"/>
      <ellipse cx="15" cy="-10" rx="16" ry="10" fill="#fef08a"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="150" y="60" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle" letter-spacing="2">ГАБРИЭЛЬ ГАРСИА МАРКЕС</text>
  <line x1="70" y1="72" x2="230" y2="72" stroke="#34d399" stroke-width="1"/>
  
  <text x="150" y="315" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">СТО ЛЕТ</text>
  <text x="150" y="345" font-family="'Times New Roman', serif" font-size="24" font-weight="bold" fill="#fef08a" text-anchor="middle">ОДИНОЧЕСТВА</text>
  <text x="150" y="380" font-family="sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">МАГИЧЕСКИЙ РЕАЛИЗМ • НОБЕЛЕВСКАЯ ПРЕМИЯ</text>
</svg>

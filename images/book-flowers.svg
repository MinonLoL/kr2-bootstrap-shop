<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bgFlowers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" rx="12" fill="url(#bgFlowers)"/>
  <rect x="15" y="15" width="270" height="390" rx="8" fill="none" stroke="#818cf8" stroke-width="2"/>

  <!-- Maze Labyrinth & Mouse silhouette / Red Rose -->
  <g transform="translate(150, 185)">
    <!-- Concentric Maze Lines -->
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="#4338ca" stroke-width="2"/>
    <rect x="-42" y="-42" width="84" height="84" fill="none" stroke="#4f46e5" stroke-width="2"/>
    <rect x="-24" y="-24" width="48" height="48" fill="none" stroke="#6366f1" stroke-width="2"/>
    <!-- Rose at center -->
    <circle cx="0" cy="0" r="12" fill="#f43f5e"/>
    <path d="M -4 -8 Q 0 -14 4 -8" fill="none" stroke="#ffe4e6" stroke-width="1.5"/>
    <!-- Mouse trail dots -->
    <circle cx="-50" cy="10" r="3" fill="#cbd5e1"/>
    <circle cx="-35" cy="-20" r="3" fill="#cbd5e1"/>
    <circle cx="0" cy="-35" r="3" fill="#cbd5e1"/>
    <circle cx="25" cy="-10" r="3" fill="#cbd5e1"/>
  </g>

  <!-- Typography -->
  <text x="150" y="60" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c7d2fe" text-anchor="middle" letter-spacing="3">ДЭНИЕЛ КИЗ</text>
  <line x1="80" y1="72" x2="220" y2="72" stroke="#818cf8" stroke-width="1"/>
  
  <text x="150" y="320" font-family="'Georgia', serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">ЦВЕТЫ ДЛЯ</text>
  <text x="150" y="350" font-family="'Georgia', serif" font-size="24" font-weight="bold" fill="#fb7185" text-anchor="middle">ЭЛДЖЕРНОНА</text>
  <text x="150" y="382" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">ПСИХОЛОГИЧЕСКАЯ ПРОЗА • ДРАМА</text>
</svg>

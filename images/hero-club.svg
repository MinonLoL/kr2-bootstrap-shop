<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lampLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="0" y="0" width="600" height="420" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle bookshelf lines in background -->
  <line x1="40" y1="90" x2="560" y2="90" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="40" y1="180" x2="560" y2="180" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="40" y1="270" x2="560" y2="270" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Books on top shelf -->
  <rect x="60" y="45" width="22" height="45" rx="3" fill="#3b82f6" opacity="0.6"/>
  <rect x="86" y="38" width="26" height="52" rx="3" fill="#ef4444" opacity="0.6"/>
  <rect x="116" y="42" width="20" height="48" rx="3" fill="#10b981" opacity="0.6"/>
  <rect x="140" y="50" width="24" height="40" rx="3" fill="#f59e0b" opacity="0.7"/>
  
  <rect x="420" y="40" width="24" height="50" rx="3" fill="#8b5cf6" opacity="0.6"/>
  <rect x="448" y="35" width="28" height="55" rx="3" fill="#ec4899" opacity="0.6"/>
  <rect x="480" y="48" width="20" height="42" rx="3" fill="#06b6d4" opacity="0.6"/>
  
  <!-- Warm Lamp Light Cone -->
  <polygon points="300,50 180,360 420,360" fill="url(#lampLight)"/>
  
  <!-- Floor Lamp -->
  <circle cx="300" cy="50" r="16" fill="#fef08a"/>
  <path d="M 285 55 L 315 55 L 325 72 L 275 72 Z" fill="#d97706"/>
  <line x1="300" y1="72" x2="300" y2="340" stroke="#64748b" stroke-width="4"/>
  <ellipse cx="300" cy="340" rx="40" ry="8" fill="#475569"/>

  <!-- Coffee Table with Books and Mug -->
  <ellipse cx="300" cy="320" rx="130" ry="32" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  
  <!-- Stack of books on table -->
  <g transform="translate(230, 260)">
    <rect x="0" y="35" width="90" height="15" rx="3" fill="#0284c7"/>
    <rect x="5" y="20" width="85" height="15" rx="3" fill="#b45309"/>
    <rect x="10" y="5" width="75" height="15" rx="3" fill="#047857"/>
    <!-- Open Book on top -->
    <path d="M 20 8 Q 45 2 65 8 L 65 0 Q 45 -6 20 0 Z" fill="#f8fafc"/>
    <path d="M 65 8 Q 85 2 105 8 L 105 0 Q 85 -6 65 0 Z" fill="#e2e8f0"/>
  </g>

  <!-- Steaming Coffee Cup -->
  <g transform="translate(340, 280)">
    <rect x="0" y="5" width="28" height="22" rx="5" fill="#f8fafc"/>
    <path d="M 28 9 C 34 9 34 19 28 19" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <ellipse cx="14" cy="5" rx="14" ry="4" fill="#78350f"/>
    <!-- Steam -->
    <path d="M 10 0 Q 8 -10 12 -18" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 18 -2 Q 22 -12 16 -22" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Gold Badge overlay: Club badge -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="145" height="95" rx="12" fill="#0f172a" stroke="#d97706" stroke-width="1.5" opacity="0.95"/>
    <circle cx="28" cy="28" r="14" fill="url(#goldAcc)"/>
    <path d="M 23 28 L 27 32 L 34 23" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">120+ встреч</text>
    <text x="50" y="38" font-family="sans-serif" font-size="10" fill="#94a3b8">проведено</text>
    <line x1="15" y1="52" x2="130" y2="52" stroke="#334155"/>
    <text x="15" y="70" font-family="sans-serif" font-size="11" fill="#cbd5e1">Каждую субботу</text>
    <text x="15" y="83" font-family="sans-serif" font-size="10" fill="#fbbf24">Офлайн и онлайн</text>
  </g>

  <g transform="translate(400, 220)">
    <rect x="0" y="0" width="150" height="95" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    <text x="16" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">500+ резидентов</text>
    <text x="16" y="42" font-family="sans-serif" font-size="10" fill="#94a3b8">влюблённых в книги</text>
    <line x1="16" y1="52" x2="134" y2="52" stroke="#334155"/>
    <text x="16" y="70" font-family="sans-serif" font-size="11" fill="#38bdf8">★ Рейтинг 4.9 / 5.0</text>
    <text x="16" y="83" font-family="sans-serif" font-size="10" fill="#cbd5e1">по отзывам 2026</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg1984" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" rx="12" fill="url(#bg1984)"/>
  
  <!-- Frame -->
  <rect x="15" y="15" width="270" height="390" rx="8" fill="none" stroke="#ef4444" stroke-width="2"/>
  
  <!-- All-seeing Eye graphic -->
  <g transform="translate(150, 185)">
    <path d="M -70 0 Q 0 -45 70 0 Q 0 45 -70 0 Z" fill="#292524" stroke="#ef4444" stroke-width="3"/>
    <circle cx="0" cy="0" r="28" fill="#ef4444"/>
    <circle cx="0" cy="0" r="16" fill="#0c0a09"/>
    <circle cx="-5" cy="-5" r="5" fill="#f87171"/>
    <!-- Surrounding rays -->
    <line x1="0" y1="-60" x2="0" y2="-50" stroke="#f87171" stroke-width="2"/>
    <line x1="45" y1="-45" x2="38" y2="-38" stroke="#f87171" stroke-width="2"/>
    <line x1="60" y1="0" x2="50" y2="0" stroke="#f87171" stroke-width="2"/>
    <line x1="-45" y1="-45" x2="-38" y2="-38" stroke="#f87171" stroke-width="2"/>
    <line x1="-60" y1="0" x2="-50" y2="0" stroke="#f87171" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <text x="150" y="65" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fca5a5" text-anchor="middle" letter-spacing="3">ДЖОРДЖ ОРУЭЛЛ</text>
  <line x1="80" y1="78" x2="220" y2="78" stroke="#ef4444" stroke-width="1"/>
  
  <text x="150" y="325" font-family="'Impact', sans-serif" font-size="64" fill="#ef4444" text-anchor="middle" letter-spacing="4">1984</text>
  <text x="150" y="358" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">БОЛЬШОЙ БРАТ СЛЕДИТ ЗА ТОБОЙ</text>
  <text x="150" y="385" font-family="sans-serif" font-size="11" fill="#78716c" text-anchor="middle">АНТИУТОПИЯ • КЛАССИКА ХХ ВЕКА</text>
</svg>

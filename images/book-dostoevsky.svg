<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bgDost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" rx="12" fill="url(#bgDost)"/>
  <rect x="15" y="15" width="270" height="390" rx="8" fill="none" stroke="#6366f1" stroke-width="2"/>
  
  <!-- Scales of Conscience Graphic -->
  <g transform="translate(150, 185)">
    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#a5b4fc" stroke-width="3"/>
    <line x1="0" y1="-30" x2="0" y2="40" stroke="#a5b4fc" stroke-width="3"/>
    <!-- Left pan -->
    <path d="M -50 -20 L -65 15 L -35 15 Z" fill="#6366f1" opacity="0.8"/>
    <!-- Right pan -->
    <path d="M 50 -20 L 35 10 L 65 10 Z" fill="#e0e7ff" opacity="0.9"/>
    <!-- Central base -->
    <rect x="-20" y="40" width="40" height="8" rx="2" fill="#a5b4fc"/>
  </g>

  <text x="150" y="65" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c7d2fe" text-anchor="middle" letter-spacing="3">ФЕДОР ДОСТОЕВСКИЙ</text>
  <line x1="60" y1="78" x2="240" y2="78" stroke="#6366f1" stroke-width="1"/>
  
  <text x="150" y="300" font-family="'Georgia', serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">ПРЕСТУПЛЕНИЕ</text>
  <text x="150" y="330" font-family="'Georgia', serif" font-size="22" font-weight="bold" fill="#c7d2fe" text-anchor="middle">И НАКАЗАНИЕ</text>
  <text x="150" y="360" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#818cf8" text-anchor="middle" letter-spacing="1">ТВАРЬ ЛИ Я ДРОЖАЩАЯ...</text>
  <text x="150" y="382" font-family="sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle" letter-spacing="1">РУССКАЯ КЛАССИКА • ПСИХОЛОГИЯ</text>
</svg>